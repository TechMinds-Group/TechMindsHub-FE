<div class="container py-4">
  <!-- Header -->
  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-3">
    <div>
      <h2 class="fw-bold text-white mb-1 d-flex align-items-center gap-2">
        <i class="fas fa-magnet text-primary me-2"></i>Captação — Lista de Sistemas
      </h2>
      <p class="text-white opacity-85 mb-0">
        Visualize a lista de sistemas integrados na plataforma. Clique na linha para visualizar os detalhes completos do sistema.
      </p>
    </div>
  </div>

  <!-- Custom Groom tm-table Component -->
  <div class="mb-5">
    <tm-table
      [cols]="cols()"
      [data]="sistemas()"
      [paginated]="true"
      [pageSize]="tamanhoPagina()"
      (pageSizeChange)="tamanhoPagina.set($event)"
      [showControls]="true"
      (rowClick)="verDetalhes($event)"
    ></tm-table>
  </div>
</div>

<!-- Templates para as colunas da tm-table -->
<ng-template #sistemaTemplate let-item>
  <div class="d-flex align-items-center gap-3">
    <div class="icon-avatar rounded-3 bg-primary-subtle text-primary p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px; min-width: 40px;">
      <i [class]="item.icone" class="fs-5 text-primary"></i>
    </div>
    <div class="text-start">
      <strong class="fw-bold text-white d-block fs-6" style="color: #ffffff !important;">{{ item.nome }}</strong>
      <span class="small d-block" style="color: #cbd5e1 !important;">{{ item.descricao }}</span>
    </div>
  </div>
</ng-template>

<ng-template #categoriaTemplate let-item>
  <span class="badge bg-secondary-subtle text-light border border-secondary px-3 py-1.5 rounded-pill fw-medium">
    <i class="fas fa-layer-group me-1 text-primary"></i>{{ item.categoria }}
  </span>
</ng-template>

<ng-template #urlTemplate let-item>
  <span class="text-primary text-decoration-none fw-mono small d-inline-flex align-items-center gap-1">
    <i class="fas fa-link me-1"></i>{{ item.url }}
  </span>
</ng-template>

<ng-template #statusTemplate let-item>
  @if (item.status === 'Ativo') {
    <span class="badge bg-success-subtle text-success border border-success px-3 py-1.5 rounded-pill fw-semibold">
      <i class="fas fa-check-circle me-1"></i>Ativo
    </span>
  } @else {
    <span class="badge bg-secondary-subtle text-secondary border border-secondary px-3 py-1.5 rounded-pill fw-semibold">
      {{ item.status }}
    </span>
  }
</ng-template>
